<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gala</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1>GALA EMPORIUM</h1>
    <nav>
      <a href="#events">Events</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <section class="hero">
    <img src="images/logo2.png" alt="Hero Image">
  </section>
  <main>
    <section class="upcoming">
      <h2>Upcoming Events</h2>
      <div class="event-grid">
        <article class="event-card">
          <p class="date">Nov 10</p>
          <h3>Jazz Night</h3>
        </article>
        <footer></footer>
        <!-- Advantage of loading your script last in the body
     if you have html before that it will already be 
     parsed by the browser and you can grab different elements-->
        <script type="module" src="js/main.js"></script>
</body>

</html>
